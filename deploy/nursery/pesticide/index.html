<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>育苗防除ログ - 山本農園</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/common/css/main.css?v=1">
  <link rel="stylesheet" href="/common/filter.css?v=1">
  <style>
    .target-grid {
      display: grid;
      gap: 10px;
    }

    .target-zone {
      border: 1px solid #dbe5f0;
      border-radius: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      padding: 12px;
      display: grid;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .target-zone__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .target-zone__title {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
    }

    .target-zone__summary {
      font-size: 13px;
      color: #475569;
      line-height: 1.4;
    }

    .target-zone__actions,
    .target-zone__lanes {
      display: grid;
      gap: 8px;
    }

    .target-zone__actions {
      grid-auto-flow: column;
      justify-content: end;
      align-items: center;
    }

    .target-zone__lanes {
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      align-items: start;
    }

    .target-lane {
      width: 100%;
      border: 1px solid #dbe5f0;
      border-radius: 12px;
      background: #fbfdff;
      padding: 7px;
      display: grid;
      gap: 6px;
      align-content: start;
    }

    .target-lane.is-active {
      border-color: #1d4ed8;
      box-shadow: inset 0 0 0 1px rgba(29, 78, 216, 0.15);
    }

    .target-lane.is-partial {
      border-color: #94a3b8;
    }

    .target-lane.is-warning {
      border-color: #f59e0b;
      background: #fffaf2;
    }

    .target-lane__head {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: #f8fafc;
      color: #0f172a;
      font-weight: 800;
      cursor: pointer;
      text-align: left;
    }

    .target-lane.is-active .target-lane__head {
      background: #eaf2ff;
      border-color: #1d4ed8;
      color: #1d4ed8;
    }

    .target-lane__badge {
      font-size: 11px;
      font-weight: 700;
      color: inherit;
      white-space: nowrap;
      line-height: 1.35;
      text-align: right;
    }

    .target-lane__body {
      display: grid;
      gap: 6px;
    }

    .target-lane__hint,
    .target-lane__empty {
      font-size: 12px;
      color: #64748b;
      padding: 2px 2px 4px;
    }

    .target-lane__warning {
      font-size: 12px;
      color: #b45309;
      background: #fff7ed;
      border: 1px solid #fdba74;
      border-radius: 8px;
      padding: 5px 8px;
    }

    .target-lot-list {
      display: grid;
      gap: 6px;
    }

    .target-lot {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 9px;
      background: #fff;
      padding: 8px 10px;
    }

    .target-lot.is-selected {
      border-color: #93c5fd;
      background: #f8fbff;
    }

    .target-lot__name {
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
    }

    .target-lot__meta {
      font-size: 12px;
      color: #475569;
      line-height: 1.45;
    }

    .target-lot__remove {
      width: 30px;
      height: 30px;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #fff;
      color: #475569;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .target-lane__footer {
      display: flex;
      justify-content: flex-end;
    }

    .target-summary {
      position: sticky;
      top: 8px;
      z-index: 1;
      font-size: 14px;
      color: #334155;
      line-height: 1.5;
      padding: 8px 10px;
      border: 1px solid #dbe5f0;
      border-radius: 10px;
      background: #f8fbff;
    }

    .target-summary strong {
      color: #0f172a;
    }

    .target-summary__warn {
      color: #b45309;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .target-zone__actions {
        grid-auto-flow: row;
        justify-content: stretch;
      }

      .target-zone__lanes {
        grid-template-columns: minmax(0, 1fr);
      }

      .target-lane__head {
        flex-direction: column;
        align-items: flex-start;
      }

      .target-lane__badge {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <div id="form-area" style="display:none;">
    <h1 class="page-title">育苗防除ログ</h1>

    <div style="margin:10px 0; display:flex; gap:10px; flex-wrap:wrap;">
      <a href="/nursery/house.html" class="secondary-btn">育苗ハウスへ戻る</a>
      <a id="edit-pesticide-master-link" href="/admin/edit-json/index.html?data=pesticide-index&return=%2Fnursery%2Fpesticide%2Findex.html" class="secondary-btn" style="display:none;">農薬基本情報を編集</a>
    </div>

    <h2 class="section-title">防除日</h2>
    <div class="card">
      <input type="date" id="date" class="form-input">
    </div>

    <h2 class="section-title">対象</h2>
    <div class="card">
      <div id="nursery-target-summary" class="target-summary">未選択</div>
      <div id="nursery-target-area" class="target-grid" style="margin-top:10px;"></div>
    </div>

    <h2 class="section-title">農薬</h2>
    <div class="card">
      <button id="open-pesticide-modal" class="filter-open-btn" data-type="pesticide">農薬を選択</button>
      <div id="activePesticideFilters" style="margin-top:10px;"></div>
    </div>

    <h2 class="section-title">使用量（農薬ごとに倍率・散布液量[L]を入力）</h2>
    <div class="card">
      <div id="pesticide-input-area">
        <p style="color:#777;">農薬を選択すると、倍率と混合後の散布液量（L）を入力できます</p>
      </div>
    </div>

    <h2 class="section-title">作業者</h2>
    <div class="card" id="workers_box"></div>

    <div class="card">
      <label for="temp_workers">単発バイト（カンマ区切り）</label>
      <input id="temp_workers" class="form-input" placeholder="例：佐藤さん, 田中さん">
    </div>

    <h2 class="section-title">備考</h2>
    <div class="card">
      <textarea id="notes" class="form-textarea"></textarea>
    </div>

    <button id="save-btn" class="primary-btn">保存</button>
  </div>

  <div id="modal-container"></div>

  <script>
    fetch("/common/save-modal.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("modal-container").innerHTML = html;
      });
  </script>

  <script type="module" src="/common/summary.js?v=1"></script>
  <script type="module" src="/common/save/index.js?v=1"></script>

  <script type="module" src="/common/filter/filter-core.js?v=1"></script>
  <script type="module" src="/common/filter/filter-pesticide.js?v=1"></script>
  <script type="module" src="/common/filter/filter-active.js?v=1"></script>

  <script type="module" src="./pesticide-input.js?v=20260724-1"></script>

  <script type="module">
    import { verifyLocalAuth, createWorkerCheckboxes } from "/common/ui.js?v=1";
    import { renderHeader } from "/common/header.js";
    import { initNurseryPesticidePage } from "./pesticide.js?v=20260724-1";

    window.addEventListener("DOMContentLoaded", async () => {
      if (!await verifyLocalAuth()) return;

      renderHeader();
      document.getElementById("form-area").style.display = "block";

      const editLink = document.getElementById("edit-pesticide-master-link");
      if (editLink && window.currentRole === "admin") {
        editLink.style.display = "inline-flex";
      }

      document.getElementById("date").value = new Date().toISOString().slice(0, 10);
      await createWorkerCheckboxes("workers_box");

      const params = new URLSearchParams(location.search);
      window.__nursery_pesticide_machine = params.get("machine") || "machine1";

      await initNurseryPesticidePage();
    });
  </script>

  <script src="/common/sw-register.js?v=20260713-1"></script>
</body>

</html>
