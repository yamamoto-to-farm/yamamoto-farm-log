<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>気象データ - 山本農園</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/common/css/main.css?v=1">
  <style>
    #page-area {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 16px 24px;
      font-size: 16px;
    }

    #page-area > .card,
    #page-area > details.card {
      margin-bottom: 14px;
      padding: 20px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      align-items: end;
      margin-bottom: 12px;
    }

    .kpi-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .kpi-chip {
      background: #f4f8ff;
      border: 1px solid #d9e6ff;
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 1em;
      color: #1f355f;
      white-space: nowrap;
    }

    .insight-title {
      margin: 0 0 8px;
      font-size: 1em;
      color: #334155;
      font-weight: 700;
    }

    .insight-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .insight-chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.98em;
      border: 1px solid #dbe3ef;
      background: #f8fbff;
      color: #334155;
      white-space: nowrap;
    }

    .insight-note {
      margin: 0;
      color: #64748b;
      font-size: 0.92em;
      line-height: 1.45;
    }

    .gdd-panel-title {
      margin: 0 0 12px;
      font-size: 1.2em;
      color: #1f2937;
    }

    .gdd-panel-toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .gdd-target-field {
      display: grid;
      gap: 4px;
      color: #475569;
      font-size: 0.98em;
    }

    .gdd-target-field input {
      width: 120px;
    }

    .gdd-status {
      margin: 14px 0 0;
      color: #64748b;
      font-size: 0.98em;
    }

    .gdd-status.is-error {
      color: #b91c1c;
    }

    .gdd-target-modal {
      max-width: 520px;
    }

    .gdd-target-modal-lead {
      margin: 0 0 16px;
      color: #475569;
      line-height: 1.6;
    }

    .gdd-target-summary {
      display: grid;
      gap: 10px;
      margin: 0;
    }

    .gdd-target-summary-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 12px;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .gdd-target-summary-row dt {
      color: #64748b;
      font-size: 0.92em;
    }

    .gdd-target-summary-row dd {
      margin: 0;
      color: #1e293b;
      font-weight: 700;
    }

    .gdd-target-modal-note {
      margin: 16px 0 0;
      color: #92400e;
      font-size: 0.92em;
      line-height: 1.5;
    }

    .gdd-target-modal .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .gdd-result {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .gdd-result-item {
      padding: 12px 14px;
      border: 1px solid #dbe3ef;
      background: #f8fbff;
    }

    .gdd-result-label {
      display: block;
      color: #64748b;
      font-size: 0.9em;
    }

    .gdd-result-value {
      display: block;
      margin-top: 3px;
      color: #1e3a8a;
      font-size: 1.25em;
      font-weight: 700;
    }

    .chart-wrap {
      position: relative;
      min-height: 460px;
      margin-top: 18px;
    }

    .chart-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 8px;
      gap: 8px;
    }

    .chart-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 1em;
      color: #334155;
      user-select: none;
    }

    .chart-toggle input {
      margin: 0;
      width: 16px;
      height: 16px;
    }

    .chart-empty {
      margin-top: 10px;
      color: #64748b;
      font-size: 0.9em;
    }

    .list-details {
      padding: 0;
      overflow: hidden;
    }

    .list-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 16px 18px;
      cursor: pointer;
      user-select: none;
      font-size: 1.05em;
      font-weight: 700;
      color: #1f2937;
      border-bottom: 1px solid #e5e7eb;
      background: #f8fafc;
      list-style: none;
    }

    .list-summary::-webkit-details-marker {
      display: none;
    }

    .list-summary::after {
      content: "▼";
      font-size: 11px;
      color: #64748b;
      transition: transform 0.16s ease;
    }

    details[open] > .list-summary::after {
      transform: rotate(180deg);
    }

    .list-summary-note {
      font-size: 14px;
      color: #64748b;
      font-weight: 600;
    }

    .list-content {
      padding: 14px 12px 16px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }

    .log-table th,
    .log-table td {
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 10px;
      text-align: left;
      vertical-align: top;
      font-size: 1em;
    }

    .log-table th {
      background: #f9fafb;
      font-weight: 700;
    }

    .weather-row-hot td {
      background: #fff7ed;
    }

    .weather-row-rainy td {
      background: #eff6ff;
    }

    .weather-type {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      border: 1px solid #dbe3ef;
      padding: 2px 8px;
      background: #f8fbff;
      white-space: nowrap;
    }

    .weather-type-icon {
      font-size: 14px;
      line-height: 1;
    }

    .weather-type-text {
      font-size: 12px;
      color: #334155;
      font-weight: 600;
    }

    .date-link {
      color: #1d4ed8;
      text-decoration: none;
      border-bottom: 1px dotted rgba(29, 78, 216, 0.45);
    }

    .date-link:hover,
    .date-link:focus-visible {
      color: #1e40af;
      border-bottom-style: solid;
      outline: none;
    }

    .meta-line {
      color: #475569;
      font-size: 0.93em;
      margin: 0;
    }

    .hint-line {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 0.86em;
    }

    .help-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      margin-left: 4px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      cursor: help;
      background: #f8fbff;
      vertical-align: middle;
    }

    .help-popover {
      position: fixed;
      z-index: 1200;
      max-width: min(320px, calc(100vw - 24px));
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #dbe3ef;
      background: #ffffff;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
      color: #0f172a;
      font-size: 12px;
      line-height: 1.55;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .help-popover.is-open {
      opacity: 1;
      transform: translateY(0);
    }

    .help-popover-title {
      margin: 0 0 4px;
      font-size: 12px;
      font-weight: 700;
      color: #1e3a8a;
    }

    .help-popover-body {
      margin: 0;
      color: #334155;
      white-space: normal;
    }

    @media (max-width: 640px) {
      .help-trigger {
        width: 20px;
        height: 20px;
        font-size: 12px;
      }

      .help-popover {
        font-size: 13px;
        max-width: calc(100vw - 16px);
      }

      .chart-wrap {
        min-height: 360px;
      }
    }

    @media (min-width: 900px) {
      #page-title {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>
  <div id="page-area" class="page-container" style="display:none;">
    <h1 id="page-title" class="page-title">気象データ</h1>

    <div class="card">
      <div class="toolbar">
        <div class="form-field">
          <label for="field">圃場</label>
          <input id="field" class="form-input" readonly>
        </div>

        <div class="form-field">
          <label for="plant-date">定植日</label>
          <input id="plant-date" type="date" class="form-input" readonly>
        </div>

        <div class="form-field">
          <label for="harvest-start">収穫開始日</label>
          <input id="harvest-start" type="date" class="form-input" readonly>
        </div>

        <div class="form-field">
          <label for="period-end">集計終了日</label>
          <input id="period-end" type="date" class="form-input" readonly>
        </div>
      </div>

      <p id="meta-line" class="meta-line"></p>
      <p class="hint-line">積算温度はLambdaのeffective GDD方式で算出しています。</p>
    </div>

    <div class="card" id="gdd-panel">
      <h2 class="gdd-panel-title">GDD確認・予測</h2>
      <div class="gdd-panel-toolbar">
        <button id="gdd-predict-btn" class="primary-btn" type="button">Lambdaで予測</button>
      </div>
      <div class="gdd-panel-toolbar">
        <button id="gdd-update-target-btn" class="secondary-btn" type="button" disabled>
          この実績GDDを目標時期の目標値に更新
        </button>
      </div>
      <p id="gdd-status" class="gdd-status">Lambda APIの設定を確認しています。</p>
      <div id="gdd-result" class="gdd-result" hidden></div>
    </div>

    <div id="gdd-target-modal" class="modal-bg" hidden>
      <div class="modal gdd-target-modal" role="dialog" aria-modal="true" aria-labelledby="gdd-target-modal-title">
        <button class="modal-close" id="gdd-target-modal-close" type="button" aria-label="閉じる">×</button>
        <h2 id="gdd-target-modal-title" class="section-title">目標GDDを更新</h2>
        <p class="gdd-target-modal-lead">この収穫実績を、品種と目標時期の基準値として保存します。</p>
        <dl class="gdd-target-summary">
          <div class="gdd-target-summary-row">
            <dt>品種</dt>
            <dd id="gdd-target-modal-variety">-</dd>
          </div>
          <div class="gdd-target-summary-row">
            <dt>目標時期</dt>
            <dd><input id="gdd-target-modal-period" class="form-input" type="month" aria-label="保存先の目標時期"></dd>
          </div>
          <div class="gdd-target-summary-row">
            <dt>保存する目標GDD</dt>
            <dd id="gdd-target-modal-gdd">-</dd>
          </div>
          <div class="gdd-target-summary-row">
            <dt>実績期間</dt>
            <dd id="gdd-target-modal-range">-</dd>
          </div>
        </dl>
        <p class="gdd-target-modal-note">保存後も「暫定値」として扱われます。既存の同じ目標時期の値は上書きされます。</p>
        <div class="modal-footer">
          <button class="secondary-btn" id="gdd-target-modal-cancel" type="button">キャンセル</button>
          <button class="primary-btn" id="gdd-target-modal-save" type="button">この値を保存</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div id="kpi-line" class="kpi-line"></div>
      <p class="insight-title">注目ポイント</p>
      <div id="insight-line" class="insight-line"></div>
      <p id="insight-note" class="insight-note"></p>
      <div class="chart-toolbar">
        <label class="chart-toggle" for="temp-toggle">
          <input id="temp-toggle" type="checkbox">
          気温を表示
        </label>
      </div>
      <div class="chart-wrap">
        <canvas id="weather-chart" aria-label="気象推移グラフ" role="img"></canvas>
      </div>
      <p id="chart-empty" class="chart-empty" style="display:none;">グラフ表示に必要なデータが不足しています。</p>
    </div>

    <details class="card list-details">
      <summary class="list-summary">
        <span>日別一覧</span>
        <span id="list-summary-note" class="list-summary-note">タップで開く</span>
      </summary>
      <div class="list-content">
        <div class="table-wrap">
        <table class="log-table">
          <thead>
            <tr>
              <th>日付</th>
              <th>天気</th>
              <th>最高</th>
              <th>最低</th>
              <th>降水量</th>
              <th>日照時間</th>
              <th>日平均</th>
              <th>
                effective GDD
                <span class="help-trigger" tabindex="0" role="button" aria-label="effective GDDの説明" data-help-key="gdd">?</span>
              </th>
              <th>
                積算effective GDD
                <span class="help-trigger" tabindex="0" role="button" aria-label="積算effective GDDの説明" data-help-key="gdd-cumulative">?</span>
              </th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        </div>
      </div>
    </details>

    <div class="back-action-slot">
      <button id="back-btn" class="secondary-btn unified-back-btn" type="button">元のページへ戻る</button>
    </div>
  </div>

    <div id="help-popover" class="help-popover" aria-hidden="true">
      <p id="help-popover-title" class="help-popover-title"></p>
      <p id="help-popover-body" class="help-popover-body"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="./weather.js?v=20260815-16"></script>
  <script src="/common/sw-register.js?v=20260713-1"></script>
</body>

</html>
