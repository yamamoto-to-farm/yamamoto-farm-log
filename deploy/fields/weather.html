<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>気象データ - 山本農園</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/common/css/main.css?v=1">
  <style>
    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      align-items: end;
      margin-bottom: 12px;
    }

    .kpi-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .kpi-chip {
      background: #f4f8ff;
      border: 1px solid #d9e6ff;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.92em;
      color: #1f355f;
      white-space: nowrap;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
    }

    .log-table th,
    .log-table td {
      border-bottom: 1px solid #e5e7eb;
      padding: 8px;
      text-align: left;
      vertical-align: top;
      font-size: 0.95em;
    }

    .log-table th {
      background: #f9fafb;
      font-weight: 700;
    }

    .weather-type {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      border: 1px solid #dbe3ef;
      padding: 2px 8px;
      background: #f8fbff;
      white-space: nowrap;
    }

    .weather-type-icon {
      font-size: 14px;
      line-height: 1;
    }

    .weather-type-text {
      font-size: 12px;
      color: #334155;
      font-weight: 600;
    }

    .meta-line {
      color: #475569;
      font-size: 0.93em;
      margin: 0;
    }

    .hint-line {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 0.86em;
    }
  </style>
</head>

<body>
  <div id="page-area" class="page-container" style="display:none;">
    <h1 id="page-title" class="page-title">気象データ</h1>

    <div class="card">
      <div class="toolbar">
        <div class="form-field">
          <label for="field">圃場</label>
          <input id="field" class="form-input" readonly>
        </div>

        <div class="form-field">
          <label for="plant-date">定植日</label>
          <input id="plant-date" type="date" class="form-input" readonly>
        </div>

        <div class="form-field">
          <label for="harvest-start">収穫開始日</label>
          <input id="harvest-start" type="date" class="form-input" readonly>
        </div>

        <div class="form-field">
          <label for="period-end">集計終了日</label>
          <input id="period-end" type="date" class="form-input" readonly>
        </div>
      </div>

      <p id="meta-line" class="meta-line"></p>
      <p class="hint-line">積算温度は簡易GDD（base 10℃）で算出しています。</p>
    </div>

    <div class="card">
      <div id="kpi-line" class="kpi-line"></div>
      <div class="table-wrap">
        <table class="log-table">
          <thead>
            <tr>
              <th>日付</th>
              <th>天気</th>
              <th>最高</th>
              <th>最低</th>
              <th>降水量</th>
              <th>日照時間</th>
              <th>日平均</th>
              <th>GDD(10)</th>
              <th>積算GDD(10)</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <div class="back-action-slot">
      <button id="back-btn" class="secondary-btn unified-back-btn" type="button">元のページへ戻る</button>
    </div>
  </div>

  <script type="module" src="./weather.js?v=20260812-1"></script>
  <script src="/common/sw-register.js?v=20260713-1"></script>
</body>

</html>
