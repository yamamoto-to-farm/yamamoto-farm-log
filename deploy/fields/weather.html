<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>気象データ - 山本農園</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/common/css/main.css?v=1">
  <style>
    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      align-items: end;
      margin-bottom: 12px;
    }

    .kpi-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .kpi-chip {
      background: #f4f8ff;
      border: 1px solid #d9e6ff;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.92em;
      color: #1f355f;
      white-space: nowrap;
    }

    .insight-title {
      margin: 0 0 8px;
      font-size: 0.95em;
      color: #334155;
      font-weight: 700;
    }

    .insight-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .insight-chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.88em;
      border: 1px solid #dbe3ef;
      background: #f8fbff;
      color: #334155;
      white-space: nowrap;
    }

    .insight-note {
      margin: 0;
      color: #64748b;
      font-size: 0.85em;
      line-height: 1.45;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
    }

    .log-table th,
    .log-table td {
      border-bottom: 1px solid #e5e7eb;
      padding: 8px;
      text-align: left;
      vertical-align: top;
      font-size: 0.95em;
    }

    .log-table th {
      background: #f9fafb;
      font-weight: 700;
    }

    .weather-row-hot td {
      background: #fff7ed;
    }

    .weather-row-rainy td {
      background: #eff6ff;
    }

    .weather-type {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      border: 1px solid #dbe3ef;
      padding: 2px 8px;
      background: #f8fbff;
      white-space: nowrap;
    }

    .weather-type-icon {
      font-size: 14px;
      line-height: 1;
    }

    .weather-type-text {
      font-size: 12px;
      color: #334155;
      font-weight: 600;
    }

    .meta-line {
      color: #475569;
      font-size: 0.93em;
      margin: 0;
    }

    .hint-line {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 0.86em;
    }

    .help-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      margin-left: 4px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      cursor: help;
      background: #f8fbff;
      vertical-align: middle;
    }

    .help-popover {
      position: fixed;
      z-index: 1200;
      max-width: min(320px, calc(100vw - 24px));
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #dbe3ef;
      background: #ffffff;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
      color: #0f172a;
      font-size: 12px;
      line-height: 1.55;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .help-popover.is-open {
      opacity: 1;
      transform: translateY(0);
    }

    .help-popover-title {
      margin: 0 0 4px;
      font-size: 12px;
      font-weight: 700;
      color: #1e3a8a;
    }

    .help-popover-body {
      margin: 0;
      color: #334155;
      white-space: normal;
    }

    @media (max-width: 640px) {
      .help-trigger {
        width: 20px;
        height: 20px;
        font-size: 12px;
      }

      .help-popover {
        font-size: 13px;
        max-width: calc(100vw - 16px);
      }
    }
  </style>
</head>

<body>
  <div id="page-area" class="page-container" style="display:none;">
    <h1 id="page-title" class="page-title">気象データ</h1>

    <div class="card">
      <div class="toolbar">
        <div class="form-field">
          <label for="field">圃場</label>
          <input id="field" class="form-input" readonly>
        </div>

        <div class="form-field">
          <label for="plant-date">定植日</label>
          <input id="plant-date" type="date" class="form-input" readonly>
        </div>

        <div class="form-field">
          <label for="harvest-start">収穫開始日</label>
          <input id="harvest-start" type="date" class="form-input" readonly>
        </div>

        <div class="form-field">
          <label for="period-end">集計終了日</label>
          <input id="period-end" type="date" class="form-input" readonly>
        </div>
      </div>

      <p id="meta-line" class="meta-line"></p>
      <p class="hint-line">積算温度は簡易GDD（base 10℃）で算出しています。</p>
    </div>

    <div class="card">
      <div id="kpi-line" class="kpi-line"></div>
      <p class="insight-title">注目ポイント</p>
      <div id="insight-line" class="insight-line"></div>
      <p id="insight-note" class="insight-note"></p>
      <div class="table-wrap">
        <table class="log-table">
          <thead>
            <tr>
              <th>日付</th>
              <th>天気</th>
              <th>最高</th>
              <th>最低</th>
              <th>降水量</th>
              <th>日照時間</th>
              <th>日平均</th>
              <th>
                GDD(10)
                <span class="help-trigger" tabindex="0" role="button" aria-label="GDD(10)の説明" data-help-key="gdd">?</span>
              </th>
              <th>
                積算GDD(10)
                <span class="help-trigger" tabindex="0" role="button" aria-label="積算GDD(10)の説明" data-help-key="gdd-cumulative">?</span>
              </th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <div class="back-action-slot">
      <button id="back-btn" class="secondary-btn unified-back-btn" type="button">元のページへ戻る</button>
    </div>
  </div>

    <div id="help-popover" class="help-popover" aria-hidden="true">
      <p id="help-popover-title" class="help-popover-title"></p>
      <p id="help-popover-body" class="help-popover-body"></p>
    </div>

    <script type="module" src="./weather.js?v=20260812-4"></script>
  <script src="/common/sw-register.js?v=20260713-1"></script>
</body>

</html>
