  <script type="module">
    // ===============================
    // デバッグフラグ（?debug=1 で有効）
    // ===============================
    const DEBUG = new URL(location.href).searchParams.get("debug") === "1";
    function dlog(...msg) {
      if (DEBUG) console.log("[DEBUG]", ...msg);
    }

    import { showPinGate, verifyLocalAuth } from "./common/ui.js?v=1";
    import { renderHeader } from "./common/header.js?v=1";
    import { loadJSON } from "./common/json.js?v=1";
    import { loadCSV } from "./common/csv.js?v=1";
    import { loadWeatherYear, classifyWeather, weatherIcon } from "./common/weather/weather.js?v=1";

    const TOP_CATEGORY_ORDER = [
      "作業ログ",
      "作業日誌・記録一覧",
      "育苗",
      "圃場",
      "分析",
      "計画",
      "管理"
    ];

    const SUB_CATEGORY_ORDER = {
      "作業ログ": [
        "播種・育苗",
        "定植",
        "収穫・出荷",
        "栽培管理",
        "圃場管理"
      ],
      "作業日誌・記録一覧": [
        "作業日誌",
        "記録一覧"
      ]
    };

    const CATEGORY_DESCRIPTIONS = {
      "作業ログ": "作業内容を入力する",
      "記録一覧": "各種作業記録を確認する",
      "育苗": "苗の状態と作業を管理する",
      "圃場": "圃場情報と栽培状況を確認する",
      "分析": "栽培・収穫データを分析する",
      "計画": "作業予定と作付計画を確認する",
      "管理": "マスタやシステム設定を管理する"
    };

    const CATEGORY_ICONS = {
      "作業ログ": "📝",
      "記録一覧": "📋",
      "育苗": "🌱",
      "圃場": "▧",
      "分析": "📊",
      "計画": "📅",
      "管理": "⚙"
    };

    function normalizeCategory(category) {
      const parts = category.split("/");
      if (parts.length === 1) {
        return [parts[0], parts[0]];
      }
      return parts;
    }

    async function loadPages() {
      dlog("loading pages.json");
      const res = await fetch(`data/pages.json?v=${Date.now()}`);
      const json = await res.json();
      dlog("pages.json loaded:", json.pages);
      return json.pages;
    }

    function createCard(page) {
      const div = document.createElement("div");
      div.className = "menu-card";
      div.innerHTML = `<a href="${page.path}">${page.name}</a>`;
      return div;
    }

    function isDiaryPage(page) {
      return page.name === "作業日誌" || page.name === "作業カレンダー";
    }

    function ensureTopCategory(top) {
      let section = document.querySelector(`section[data-top="${top}"]`);
      if (!section) {
        dlog("create top category:", top);

        section = document.createElement("section");
        section.dataset.top = top;
        section.id = `category-${top.replace(/[^\w\u3040-\u30ff]/g, "-")}`;
        section.className = "category-section";

        const h2 = document.createElement("h2");
        const categoryButton = document.createElement("button");
        categoryButton.type = "button";
        categoryButton.className = "category-title";
        const icon = document.createElement("span");
        icon.className = "category-title__icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = CATEGORY_ICONS[top] || "▣";
        categoryButton.append(document.createTextNode(top), icon);
        categoryButton.setAttribute("aria-expanded", "false");

        const container = document.createElement("div");
        container.className = "subcategory-container";
        container.style.display = "none";
        container.id = `${section.id}-subcategories`;
        categoryButton.setAttribute("aria-controls", container.id);

        const meta = document.createElement("p");
        meta.className = "category-meta";
        const description = document.createElement("p");
        description.className = "category-description";
        description.textContent = CATEGORY_DESCRIPTIONS[top] || "関連する機能を開く";

        const directGrid = document.createElement("div");
        directGrid.className = "menu-grid direct-grid";

        h2.appendChild(categoryButton);
        section.appendChild(h2);
        section.appendChild(description);
        section.appendChild(meta);
        section.appendChild(container);
        section.appendChild(directGrid);
        document.getElementById("menu-area").appendChild(section);
      }
      return section;
    }

    function ensureSubCategory(topSection, sub) {
      const topContainer = topSection.querySelector(".subcategory-container");
      let subSection = topContainer.querySelector(`div[data-sub="${sub}"]`);
      if (!subSection) {
        dlog("create sub category:", sub);

        subSection = document.createElement("div");
        subSection.dataset.sub = sub;
        subSection.className = "subcategory-section";

        const h3 = document.createElement("h3");
        const subButton = document.createElement("button");
        subButton.type = "button";
        subButton.className = "subcategory-title";
        subButton.textContent = sub;
        subButton.setAttribute("aria-expanded", "false");

        const grid = document.createElement("div");
        grid.className = "menu-grid";
        grid.id = `${topSection.id}-${sub.replace(/[^\w\u3040-\u30ff]/g, "-")}-links`;
        grid.hidden = true;
        subButton.setAttribute("aria-controls", grid.id);

        h3.appendChild(subButton);
        subSection.appendChild(h3);
        subSection.appendChild(grid);
        topContainer.appendChild(subSection);
      }
      return subSection.querySelector(".menu-grid");
    }

    async function renderCategoryUpdateStats() {
      const section = document.querySelector('section[data-top="記録一覧"]');
      const meta = section?.querySelector(".category-meta");
      if (!meta) return;

      const labels = {
        seed: "播種",
        nursery: "育苗",
        "nursery-pesticide": "育苗防除",
        planting: "定植",
        harvest: "収穫",
        pesticide: "防除",
        fertilizer: "施肥",
        watering: "潅水",
        weeding: "除草",
        tillage: "耕起",
        "field-maintenance": "圃場整備",
        "hand-weeding": "手作業除草",
        intertill: "中耕",
        bedmaking: "畝立て"
      };
      const counts = {};
      let recordCount = 0;
      const today = new Date();
      const start = new Date(today);
      start.setHours(0, 0, 0, 0);
      start.setDate(start.getDate() - 6);
      const startYmd = toYmd(start);
      const endYmd = toYmd(today);

      try {
        const monthly = await loadJSON("/data/monthly-work-index.json");
        Object.values(monthly?.months || {}).forEach(monthData => {
          Object.entries(monthData?.days || {}).forEach(([date, sources]) => {
            if (date < startYmd || date > endYmd) return;
            Object.entries(sources || {}).forEach(([source, count]) => {
              const numericCount = Number(count || 0);
              recordCount += numericCount;
              counts[source] = (counts[source] || 0) + numericCount;
            });
          });
        });
      } catch (error) {
        dlog("record list stats unavailable", error);
      }

      const breakdown = Object.entries(counts)
        .filter(([source]) => labels[source])
        .sort((a, b) => b[1] - a[1])
        .slice(0, 4)
        .map(([source, count]) => `${labels[source]} ${count}件`)
        .join(" / ");
      meta.innerHTML = `直近7日間の記録：${recordCount}件${breakdown ? `<span class="category-meta__breakdown">${breakdown}</span>` : ""}`;
    }

    function closeMenuModal() {
      const modal = document.getElementById("menu-modal");
      if (!modal) return;
      modal.hidden = true;
      document.body.style.overflow = "";
    }

    function openMenuModal(section) {
      const modal = document.getElementById("menu-modal");
      const title = document.getElementById("menu-modal-title");
      const groups = document.getElementById("menu-modal-groups");
      if (!modal || !title || !groups || !section) return;

      title.textContent = section.dataset.top || "メニュー";
      groups.replaceChildren();

      const subSections = section.querySelectorAll(".subcategory-section");
      subSections.forEach(subSection => {
        const subTitle = subSection.querySelector(".subcategory-title")?.textContent || "その他";
        const sourceGrid = subSection.querySelector(".menu-grid");
        const links = sourceGrid ? sourceGrid.querySelectorAll(".menu-card") : [];
        if (!links.length) return;

        if (subTitle === section.dataset.top) {
          const linkGrid = document.createElement("div");
          linkGrid.className = "menu-modal__links";
          links.forEach(link => linkGrid.appendChild(link.cloneNode(true)));
          groups.appendChild(linkGrid);
          return;
        }

        const group = document.createElement("details");
        group.className = "menu-modal__group";
        const heading = document.createElement("summary");
        heading.className = "menu-modal__group-title";
        heading.textContent = subTitle;
        const linkGrid = document.createElement("div");
        linkGrid.className = "menu-modal__links";
        links.forEach(link => linkGrid.appendChild(link.cloneNode(true)));
        group.append(heading, linkGrid);
        groups.appendChild(group);
      });

      const directLinks = section.querySelectorAll(".direct-grid > .menu-card");
      if (directLinks.length) {
        const linkGrid = document.createElement("div");
        linkGrid.className = "menu-modal__links";
        directLinks.forEach(link => linkGrid.appendChild(link.cloneNode(true)));
        groups.appendChild(linkGrid);
      }

      modal.hidden = false;
      document.body.style.overflow = "hidden";
      modal.querySelector("[data-menu-modal-close]")?.focus();
    }

    function sortPages(pages) {
      dlog("sorting pages");
      return pages.sort((a, b) => {
        const [aTop, aSub] = normalizeCategory(a.category);
        const [bTop, bSub] = normalizeCategory(b.category);

        const topA = TOP_CATEGORY_ORDER.indexOf(aTop);
        const topB = TOP_CATEGORY_ORDER.indexOf(bTop);
        if (topA !== topB) return topA - topB;

        const subOrder = SUB_CATEGORY_ORDER[aTop] || [];
        const subA = subOrder.indexOf(aSub);
        const subB = subOrder.indexOf(bSub);

        if (subA !== -1 && subB !== -1) return subA - subB;

        return aSub.localeCompare(bSub, "ja");
      });
    }

    function formatJapaneseYmd(ymd) {
      if (!ymd || !/^\d{4}-\d{2}-\d{2}$/.test(String(ymd))) return "記録なし";
      const [, m, d] = String(ymd).split("-");
      return `${Number(m)}/${Number(d)}`;
    }

    function formatShortDiaryDate(ymd) {
      if (!ymd || !/^\d{4}-\d{2}-\d{2}$/.test(String(ymd))) return "日付不明";
      const [, m, d] = String(ymd).split("-");
      return `${Number(m)}/${Number(d)}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function toYmd(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function normalizeTypeLabel(typeValue) {
      if (!typeValue) return "作業";
      const raw = String(typeValue).trim();
      if (!raw) return "作業";
      const colonMatch = raw.match(/[:：](.+)$/);
      return colonMatch ? colonMatch[1].trim() : raw.replace(/^.+?：/, "").trim() || raw;
    }

    function getDiaryTypeLink(type) {
      if (/播種|定植/.test(type)) return "/list/list.html";
      if (/収穫/.test(type)) return "/performance/harvest-kpi.html";
      if (/施肥/.test(type)) return "/fertilizer/list/list.html";
      if (/防除/.test(type)) return "/pesticide/list/list.html";
      if (/除草|草刈/.test(type)) return "/field/weeding/list.html";
      if (/耕起|土づくり/.test(type)) return "/field/tillage/list.html";
      return "";
    }

    function openDiaryPreviewModal(date, diary) {
      const modal = document.getElementById("diary-preview-modal");
      const content = document.getElementById("diary-preview-modal-content");
      if (!modal || !content) return;

      const works = Array.isArray(diary?.work) ? diary.work : [];
      const workHtml = works.length ? works.map(entry => {
        const type = normalizeTypeLabel(entry?.type || entry?.workType || "作業");
        const fields = Array.isArray(entry?.field) ? entry.field : [entry?.field];
        const fieldText = fields.map(value => String(value || "").trim()).filter(Boolean).join("・") || "圃場未登録";
        const workers = Array.isArray(entry?.workers) ? entry.workers.join("・") : String(entry?.workers || "").trim();
        const time = [entry?.start, entry?.end].filter(Boolean).join("〜");
        return `<div class="diary-preview-modal__work">
          <p class="diary-preview-modal__work-title">${escapeHtml(type)}</p>
          <div>圃場：${escapeHtml(fieldText)}</div>
          ${workers ? `<div>作業者：${escapeHtml(workers)}</div>` : ""}
          ${time ? `<div>時間：${escapeHtml(time)}</div>` : ""}
        </div>`;
      }).join("") : "<p>この日の作業記録はありません。</p>";
      const memo = String(diary?.memo || "").trim();

      content.innerHTML = `
        <h2 class="diary-preview-modal__title">作業日誌 ${escapeHtml(formatJapaneseYmd(date))}</h2>
        ${workHtml}
        ${memo ? `<p class="diary-preview-modal__memo"><strong>備考</strong><br>${escapeHtml(memo)}</p>` : ""}
        <div class="diary-preview-modal__footer">
          <a class="secondary-btn" href="/diary/index.html?date=${encodeURIComponent(date)}">日誌ページで開く</a>
          <button type="button" class="secondary-btn" data-diary-preview-close>閉じる</button>
        </div>
      `;
      modal.hidden = false;
      document.body.style.overflow = "hidden";
      content.querySelector("[data-diary-preview-close]")?.focus();
    }

    function closeDiaryPreviewModal() {
      const modal = document.getElementById("diary-preview-modal");
      if (!modal) return;
      modal.hidden = true;
      document.body.style.overflow = "";
    }

    async function loadRecentDiaryStatus() {
      const statuses = [];
      const today = new Date();

      for (let offset = 0; offset <= 7; offset += 1) {
        const date = new Date(today);
        date.setHours(0, 0, 0, 0);
        date.setDate(today.getDate() - offset);
        const ymd = toYmd(date);
        const year = ymd.slice(0, 4);

        try {
          const diary = await loadJSON(`/data/diary/${year}/${ymd}.json`);
          const workList = Array.isArray(diary?.work) ? diary.work : [];
          statuses.push({ ymd, workCount: workList.length, diary });
        } catch (error) {
          statuses.push({ ymd, workCount: 0, diary: null });
        }
      }

      const recentEntries = statuses.filter(item => item.workCount > 0);
      const latestEntry = recentEntries.length ? recentEntries[0] : null;
      const monitoredEntries = statuses.filter(item => item.ymd !== toYmd(today));
      const missingEntries = monitoredEntries.filter(item => item.workCount === 0);

      return {
        missingCount: missingEntries.length,
        missingEntries,
        latestEntry,
        recentEntries
      };
    }

    function renderDiaryCard(status) {
      const diaryCard = document.getElementById("ops-diary-card");
      if (!diaryCard) return;

      const missingCount = Number(status?.missingCount || 0);
      const isMissing = missingCount > 0;
      const cardClass = missingCount >= 2 ? "ops-card--warn" : isMissing ? "ops-card--alert" : "ops-card--ok";
      diaryCard.className = `ops-card ${cardClass}`;

      const latestDateText = status?.latestEntry ? formatJapaneseYmd(status.latestEntry.ymd) : "記録なし";
      const latestDateLink = status?.latestEntry
        ? `<button type="button" class="diary-card__date-button" data-diary-date="${status.latestEntry.ymd}">${latestDateText}</button>`
        : latestDateText;
      const workCount = status?.latestEntry?.diary?.work?.length || 0;
      const detailButton = status?.latestEntry
        ? `<button type="button" class="diary-card__detail-button" data-diary-date="${status.latestEntry.ymd}">作業内容を確認（${workCount}件）</button>`
        : "";
      const missingEntries = Array.isArray(status?.missingEntries) ? status.missingEntries : [];
      const missingLinks = [...missingEntries].reverse().map(item =>
        `<a href="/diary/index.html?date=${item.ymd}">${formatShortDiaryDate(item.ymd)}</a>`
      ).join("・");

      diaryCard.innerHTML = `
        <div class="ops-card__label">作業日誌</div>
        ${isMissing ? `
          <div class="ops-card__value">${missingCount}日分の日誌がありません</div>
          <p class="diary-card__warning">確認が必要な日：<span class="diary-card__missing-links">${missingLinks}</span></p>
        ` : `
          <p class="diary-card__preview"><strong>直近の記録</strong><br>${latestDateLink}<br>${detailButton}</p>
        `}
        ${isMissing ? `<div class="diary-card__latest"><span class="diary-card__latest-label">直近の記録</span>${latestDateLink}<br>${detailButton}</div>` : ""}
        <div class="diary-card__actions">
          <a href="/diary/index.html">作業日誌を見る</a>
          <a href="/schedule/monthly-work/index.html">作業カレンダーを見る</a>
        </div>
      `;
      diaryCard.querySelectorAll("[data-diary-date]").forEach(button => button.addEventListener("click", () => {
        openDiaryPreviewModal(status.latestEntry.ymd, status.latestEntry.diary);
      }));
    }

    function formatScheduleDate(ymd) {
      if (!ymd) return "日付未定";
      const date = new Date(`${ymd}T00:00:00`);
      if (Number.isNaN(date.getTime())) return ymd;
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    async function loadScheduleStatus() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const limit = new Date(today);
      limit.setDate(limit.getDate() + 14);

      try {
        const rows = await loadCSV(`/logs/schedule/planting/${today.getFullYear()}.csv`);
        const upcoming = rows
          .map(row => ({ ...row, planDate: row.planPlantDate || row.plantDate || "" }))
          .filter(row => row.planDate)
          .filter(row => {
            const date = new Date(`${row.planDate}T00:00:00`);
            return !Number.isNaN(date.getTime()) && date >= today && date <= limit;
          })
          .sort((a, b) => a.planDate.localeCompare(b.planDate));
        return upcoming;
      } catch (error) {
        return [];
      }
    }

    function renderScheduleCard(rows, plantingRows) {
      const card = document.getElementById("ops-schedule-card");
      if (!card) return;
      const preview = rows.slice(0, 3);
      const plannedPlantings = Array.isArray(plantingRows) ? plantingRows : [];
      const plantingFieldCount = new Set(plannedPlantings.map(row => row.field).filter(Boolean)).size;
      card.className = `ops-card ${rows.length ? "ops-card--alert" : "ops-card--ok"}`;
      card.innerHTML = `
        <div class="ops-card__label">次の作業</div>
        <div class="ops-card__value">${rows.length}件</div>
        <ul class="ops-card__list">
          ${preview.length ? preview.map(row => `<li>${formatScheduleDate(row.planDate)} ${row.field || "圃場未定"}：定植</li>`).join("") : "<li>14日以内の定植予定はありません</li>"}
          <li>今月の定植予定：${plannedPlantings.length}件（${plantingFieldCount}圃場）</li>
          <li><a href="/schedule/plan.html">→ 定植予定を見る</a></li>
        </ul>
      `;
    }

    async function loadPlantingStatus() {
      try {
        const rows = await loadCSV(`/logs/schedule/planting/${new Date().getFullYear()}.csv`);
        const monthPrefix = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, "0")}`;
        return rows.filter(row => String(row.planPlantDate || "").startsWith(monthPrefix));
      } catch (error) {
        return [];
      }
    }

    async function loadWeatherStatus() {
      const today = new Date();
      const currentYear = today.getFullYear();
      const currentWeather = await loadWeatherYear(String(currentYear));
      const previousWeather = await loadWeatherYear(String(currentYear - 1));
      const availableDates = Object.keys(currentWeather || {})
        .filter(date => /^\d{4}-\d{2}-\d{2}$/.test(date))
        .sort();
      const dates = availableDates.slice(-3);
      return {
        days: dates.map(date => ({
          date,
          row: currentWeather[date] || null,
          previousRow: previousWeather?.[`${currentYear - 1}${date.slice(4)}`] || null
        }))
      };
    }

    function renderWeatherCard(status) {
      const card = document.getElementById("ops-weather-card");
      if (!card) return;
      const days = Array.isArray(status?.days) ? status.days : [];
      card.className = "ops-card ops-card--info weather-card";
      card.innerHTML = `
        <div class="weather-card__section">
          <p class="weather-card__section-title">天候実績</p>
          <div class="weather-days">
            ${days.length ? days.map(day => {
              const row = day.row;
              const previousRow = day.previousRow;
              const type = row ? classifyWeather(Number(row.precip || 0), Number(row.sunshine || 0)) : "データなし";
              return `<a class="weather-day" href="/diary/index.html?date=${day.date}" title="${formatJapaneseYmd(day.date)}の作業日誌を開く">
                <span class="weather-day__date">${formatJapaneseYmd(day.date)}</span>
                <span class="weather-day__type">${row ? `${weatherIcon(type)} ${type}` : "-"}</span>
                <span class="weather-day__temp">${row ? `${Number(row.tmax).toFixed(1)}℃／${Number(row.tmin).toFixed(1)}℃　${Number(row.precip).toFixed(1)}mm` : "-"}</span>
                <span class="weather-day__previous"><span class="weather-day__previous-label">昨年</span>${previousRow ? `${Number(previousRow.tmax).toFixed(1)}℃／${Number(previousRow.tmin).toFixed(1)}℃　${Number(previousRow.precip).toFixed(1)}mm` : "データなし"}</span>
              </a>`;
            }).join("") : "<div class=\"weather-day\">気象データなし</div>"}
          </div>
        </div>
        <div class="weather-card__section">
          <p class="weather-card__section-title">作業判断</p>
          <p class="weather-card__judgment">判断メッセージは今後追加予定です。</p>
          <p class="weather-card__judgment"><a href="/weather/index.html">→ 天候詳細を見る</a></p>
        </div>
      `;
    }

    async function bootTopMenu() {
      dlog("PIN OK → renderHeader");

      const pendingReturnUrl = sessionStorage.getItem("pendingReturnUrl");
      if (pendingReturnUrl) {
        sessionStorage.removeItem("pendingReturnUrl");
        location.href = pendingReturnUrl;
        return;
      }

      renderHeader();
      const dashboardTitle = document.querySelector(".ops-dashboard__title");
      if (dashboardTitle) dashboardTitle.textContent = `${formatJapaneseYmd(toYmd(new Date()))}の山本農園`;
      document.getElementById("ops-dashboard").style.display = "block";
      document.getElementById("menu-area").style.display = "grid";

      const diaryStatus = await loadRecentDiaryStatus();
      renderDiaryCard(diaryStatus);
      const [scheduleRows, plantingRows, weatherStatus] = await Promise.all([
        loadScheduleStatus(),
        loadPlantingStatus(),
        loadWeatherStatus()
      ]);
      renderScheduleCard(scheduleRows, plantingRows);
      renderWeatherCard(weatherStatus);

      const role = window.currentRole;
      dlog("currentRole =", role);

      let pages = await loadPages();
      pages = sortPages(pages);

      pages.forEach(page => {
        dlog("check page:", page.name, "roles:", page.roles);

        if (!page.roles.includes(role)) return;
        if (page.category.startsWith("管理/")) return;

        if (isDiaryPage(page)) return;
        const rawTop = page.category.split("/")[0];
        const top = rawTop === "作業日誌・記録一覧" ? "記録一覧" : rawTop;
        const section = ensureTopCategory(top);

        if (page.category.includes("/")) {
          const [, sub] = page.category.split("/");
          const grid = ensureSubCategory(section, sub);
          grid.appendChild(createCard(page));
        } else {
          const directGrid = section.querySelector(".direct-grid");
          directGrid.appendChild(createCard(page));
        }
      });

      await renderCategoryUpdateStats();

      dlog("menu rendering complete");
    }

    window.addEventListener("DOMContentLoaded", async () => {
      dlog("DOMContentLoaded start");

      const hasValidSession = await verifyLocalAuth({
        silent: true,
        noRedirect: true,
        source: "top-page"
      });

      if (hasValidSession) {
        document.getElementById("pin-area").style.display = "none";
        await bootTopMenu();
      } else {
        showPinGate("pin-area", bootTopMenu);
      }

      document.addEventListener("click", (e) => {
        if (e.target.classList.contains("category-title")) {
          const section = e.target.closest(".category-section");
          openMenuModal(section);
        }

        if (e.target.closest("[data-menu-modal-close]")) closeMenuModal();
      });

      document.getElementById("menu-modal")?.addEventListener("click", (e) => {
        if (e.target.id === "menu-modal") closeMenuModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeMenuModal();
      });

      document.addEventListener("click", (e) => {
        if (e.target.closest("[data-diary-preview-close]")) closeDiaryPreviewModal();
        if (e.target.id === "diary-preview-modal") closeDiaryPreviewModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDiaryPreviewModal();
      });
    });
  </script>
</head>

<body>

  <div id="pin-area" style="display:none;">
    <div>アクセスキーを入力してください</div>
    <input id="pin-input" type="password" class="pin-input">
    <button id="pin-submit" class="pin-submit">OK</button>
  </div>

  <div id="ops-dashboard" class="ops-dashboard" style="display:none;">
    <div class="ops-dashboard__header">
      <h2 class="ops-dashboard__title">今日の山本農園</h2>
      <span class="ops-dashboard__tag">運用状況</span>
    </div>
    <div class="ops-dashboard__grid">
      <article id="ops-diary-card" class="ops-card ops-card--warn">
        <div class="ops-card__label">作業日誌</div>
        <div class="ops-card__value">読み込み中...</div>
      </article>

      <article id="ops-weather-card" class="ops-card ops-card--info">
        <div class="ops-card__label">天候実績</div>
        <div class="ops-card__value">読み込み中...</div>
      </article>

      <article id="ops-schedule-card" class="ops-card ops-card--alert">
        <div class="ops-card__label">次の作業</div>
        <div class="ops-card__value">読み込み中...</div>
      </article>
    </div>
  </div>

  <div id="menu-area" style="display:none">
    <h2 class="menu-area__title">メニュー</h2>
  </div>

  <div id="menu-modal" class="menu-modal" hidden>
    <section class="menu-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="menu-modal-title">
      <div class="menu-modal__header">
        <h2 id="menu-modal-title" class="menu-modal__title">メニュー</h2>
      </div>
      <div id="menu-modal-groups"></div>
      <div class="menu-modal__footer">
        <button type="button" class="secondary-btn menu-modal__close" data-menu-modal-close>閉じる</button>
      </div>
    </section>
  </div>

  <div id="diary-preview-modal" class="diary-preview-modal" hidden>
    <section class="diary-preview-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="diary-preview-modal-content">
      <div id="diary-preview-modal-content"></div>
    </section>
  </div>

  <script src="/common/sw-register.js?v=20260713-1"></script>
</body>
</html>
