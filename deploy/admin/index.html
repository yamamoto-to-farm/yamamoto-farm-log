<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>管理ページ - 山本農園</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ★ 共通デザイン -->
  <link rel="stylesheet" href="/common/css/main.css?v=1">
  <style>
    .admin-group { margin-bottom: 24px; }
    .admin-group h2 { font-size: 1rem; margin: 0 0 8px; padding-bottom: 4px;
      border-bottom: 2px solid #c8e6c9; color: #2e7d32; text-align: left; }
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px; }
    .admin-grid a { display: block; background: #fff; border: 1px solid #ddd; border-radius: 8px;
      padding: 14px 12px; text-decoration: none; color: #333; font-size: 0.9rem; font-weight: 600;
      text-align: center; }
    .admin-grid a:hover { border-color: #2e7d32; background: #f1f8f2; }
  </style>
</head>

<body>

  <div id="header"></div>

  <div id="admin-area" class="page-container" style="display:none;">
    <h1 class="page-title">管理ページ</h1>
    <div id="admin-list"></div>
  </div>

  <script type="module">
    import { verifyLocalAuth } from "/common/ui.js";
    import { renderHeader } from "/common/header.js?v=1.1";

    // 表示順（pages.json の category「管理/○○」の○○）
    const GROUP_ORDER = ["労務・シフト", "データ編集", "アカウント", "その他ツール"];

    async function loadPages() {
      const res = await fetch(`/data/pages.json?ts=${Date.now()}`, { cache: "no-store" });
      return (await res.json()).pages;
    }

    window.addEventListener("DOMContentLoaded", async () => {

      // 認証チェック
      const ok = await verifyLocalAuth();
      if (!ok) return;

      // worker → アクセス禁止
      if (window.currentRole !== "admin") {
        alert("このページは管理者のみアクセスできます");
        location.href = "../index.html";
        return;
      }

      renderHeader({ adminPage: true });
      document.getElementById("admin-area").style.display = "block";

      // 管理/〜 のツールをグループごとに表示（admin 自身は除外）
      const pages = await loadPages();
      const adminTools = pages.filter(p =>
        !p.accessOnly && p.category?.startsWith("管理/") && p.id !== "admin" &&
        Array.isArray(p.roles) && p.roles.includes(window.currentRole)
      );

      const groups = new Map();
      for (const p of adminTools) {
        const group = p.category.split("/")[1] || "その他ツール";
        if (!groups.has(group)) groups.set(group, []);
        groups.get(group).push(p);
      }
      const order = [...GROUP_ORDER.filter(g => groups.has(g)),
                     ...[...groups.keys()].filter(g => !GROUP_ORDER.includes(g))];

      document.getElementById("admin-list").innerHTML = order.map(group => `
        <section class="admin-group">
          <h2>${group}</h2>
          <div class="admin-grid">
            ${groups.get(group).map(p => `<a href="${p.path}">${p.name}</a>`).join("")}
          </div>
        </section>`).join("");
    });
  </script>

  <script src="/common/sw-register.js?v=20260713-1"></script>
</body>
</html>
