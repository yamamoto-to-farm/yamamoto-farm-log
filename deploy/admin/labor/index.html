<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>労務費ダッシュボード - 山本農園</title>
  <link rel="stylesheet" href="/common/css/main.css?v=1">
  <link rel="stylesheet" href="./labor.css?v=20261031-1">
</head>
<body>
  <div id="header"></div>

  <div id="page-area" class="page-container" hidden>
    <h1 class="page-title">労務費ダッシュボード</h1>
    <p class="labor-note">各月の最新シフトデータ（編集を適用）から人件費（交通費込み）を集計した概算です。月末にTimeTreeを確定して「☁ 再取得」した月は、ほぼ実績値になります。</p>

    <p id="status" role="status" aria-live="polite"></p>
    <div id="login-area" hidden>
      <button id="login" class="primary-btn" type="button">シフト管理ログイン</button>
      <p class="labor-note">写真ページと同じアカウントでログインします（admin / family のみ閲覧可）。</p>
    </div>

    <div id="dash-area" hidden>
      <section class="card">
        <div id="summary" class="labor-summary"></div>
      </section>

      <section class="card">
        <h2 class="labor-h2">月別の人件費（人別の内訳・▼=予算上限）</h2>
        <div id="chart" class="labor-chart"></div>
        <div id="legend" class="labor-legend"></div>
      </section>

      <section class="card">
        <h2 class="labor-h2">月別の集計</h2>
        <div class="labor-scroll"><table id="month-table" class="labor-table"></table></div>
      </section>

      <section class="card">
        <h2 class="labor-h2">人別の内訳</h2>
        <div class="labor-scroll"><table id="person-table" class="labor-table"></table></div>
      </section>
    </div>

    <div class="back-action-slot">
      <a href="/admin/shift/index.html" class="secondary-btn unified-back-btn">シフト管理へ</a>
      <a href="/admin/index.html" class="secondary-btn unified-back-btn">管理ページへ戻る</a>
    </div>
  </div>

  <script type="module" src="./labor.js?v=20261031-1"></script>
</body>
</html>
