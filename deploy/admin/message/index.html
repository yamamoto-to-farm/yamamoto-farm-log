<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>業務連絡（LINE下書き） - 山本農園</title>
  <link rel="stylesheet" href="/common/css/main.css?v=1">
  <link rel="stylesheet" href="/common/filter.css?v=1">
  <link rel="stylesheet" href="./message.css?v=20261104-unified-1">
</head>
<body>
  <div id="header"></div>

  <div id="page-area" class="page-container" hidden>
    <h1 class="page-title">業務連絡（LINE下書き）</h1>
    <p class="msg-note">文面を作ってコピーし、LINEに貼り付けて送る運用です（このページから自動送信はしません）。</p>
    <p><a id="direct-plan-link" class="secondary-btn" href="/schedule/daily-plan/index.html">作業予定を追加・編集</a></p>
    <p id="status" role="status" aria-live="polite"></p>

    <div class="msg-tabs">
      <button class="msg-tab on" data-tab="daily" type="button">作業予定の連絡</button>
      <button class="msg-tab" data-tab="templates" type="button">毎月の定型文</button>
    </div>

    <section id="tab-daily" class="card">
      <div class="msg-toolbar">
        <label>日付 <input id="msg-date" type="date" class="form-input"></label>
        <button id="load-plans" class="secondary-btn" type="button">予定を読み込む</button>
        <button id="msg-login" class="secondary-btn" type="button" hidden>シフト連携ログイン</button>
      </div>
      <p class="msg-muted">保存済み予定から連絡文を作ります。コピーでは予定を変更せず、連絡時点の予定・文面の控えを保存します。コピーはLINE送信を意味しません。</p>
      <div id="cards" class="msg-cards"></div>
    </section>

    <section id="tab-templates" class="card" hidden>
      <p id="template-status" class="msg-error" role="status"></p>
      <p class="msg-muted">{年}・{月}・{先月}・{来月}・{翌月5日}（曜日付き）は今日の日付から自動で置き換えています。コピーしてLINEへ貼り付けてください。</p>
      <div id="template-list"></div>
      <details class="msg-edit-wrap">
        <summary>✏ 定型文を編集</summary>
        <div id="template-edit"></div>
        <div class="msg-edit-actions">
          <button id="add-template" class="secondary-btn" type="button">＋定型文を追加</button>
          <button id="save-templates" class="primary-btn" type="button">保存</button>
        </div>
      </details>
    </section>

    <div class="back-action-slot">
      <a href="/admin/shift/index.html" class="secondary-btn unified-back-btn">シフト管理へ</a>
      <a href="/admin/index.html" class="secondary-btn unified-back-btn">管理ページへ戻る</a>
    </div>
  </div>

  <datalist id="dl-reasons">
    <option value="雨天予報のため"></option>
    <option value="台風接近のため"></option>
    <option value="圃場の状態が悪いため"></option>
    <option value="作業の都合により"></option>
  </datalist>

  <script type="module" src="./message.js?v=20261104-unified-1"></script>
</body>
</html>
