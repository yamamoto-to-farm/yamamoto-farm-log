<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月間作業計画 - 山本農園</title>
  <link rel="stylesheet" href="/common/css/main.css?v=1">
  <link rel="stylesheet" href="./work-plan.css?v=20261105-notes-1">
  <link rel="stylesheet" href="/common/css/work-plan-form.css?v=20261105-task-2">
  <link rel="stylesheet" href="/common/css/recent-pages.css?v=20261105-layout-1">
  <script type="module" src="/common/help.js?v=20261106-1"></script>
</head>
<body class="recent-page">
  <div id="header"></div>

  <div id="page-area" class="page-container" hidden>
    <h1 class="page-title">月間作業計画</h1>
    <p class="wp-note">その月の作業と契約出荷の予定です。シフト管理のカレンダーにも表示されます。</p>

    <section class="card wp-toolbar">
      <button id="prev-month" class="secondary-btn" type="button">◀ 前月</button>
      <span id="month-title" class="wp-month"></span>
      <button id="next-month" class="secondary-btn" type="button">翌月 ▶</button>
      <span id="status" role="status" aria-live="polite"></span>
      <button id="import-plans" class="secondary-btn" type="button" hidden>📥 予定を取り込む</button>
      <button id="save" class="primary-btn wp-save" type="button" hidden>保存する</button>
    </section>

    <section class="card" id="memo-card">
      <h2 class="wp-h2">この月のメモ</h2>
      <textarea id="memo" class="form-textarea" rows="2" placeholder="例：第2週が定植ピーク。収穫は週3回。"></textarea>
    </section>

    <section class="card">
      <h2 class="wp-h2">カレンダー</h2>
      <p class="wp-note" id="edit-hint" data-help="カレンダーの編集方法" hidden>日付をクリックすると作業と出荷予定の基数を追加・編集できます。変更後は「保存する」を押してください。</p>
      <div id="calendar"></div>
    </section>

    <div class="back-action-slot">
      <button class="secondary-btn unified-back-btn" type="button" onclick="history.back()">戻る</button>
    </div>
  </div>

  <dialog id="day-dialog" class="wp-dialog">
    <h3 id="day-title"></h3>
    <div id="day-rows"></div>
    <button id="day-add" class="secondary-btn" type="button">＋ 作業を追加</button>
    <fieldset id="shipment-editor" class="wp-shipment" hidden>
      <legend>契約出荷の予定</legend>
      <label for="shipment-count">この出荷予定日の合計基数</label>
      <input id="shipment-count" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="例：12">
      <p class="wp-note">この画面の日付の契約出荷予定です（同日の合計を1つ登録）。作業日・作業内容を変更しても出荷予定は残ります。空欄にして反映すると解除します。</p>
    </fieldset>
    <p id="day-error" role="alert"></p>
    <div class="wp-dialog-actions">
      <button id="day-ok" class="primary-btn" type="button">反映</button>
      <button id="day-cancel" class="secondary-btn" type="button">キャンセル</button>
    </div>
  </dialog>

  <dialog id="import-dialog" class="wp-dialog">
    <h3>予定の取り込み（参考）</h3>
    <p class="wp-note">播種計画の播種・定植予定日と、定植ログからの中耕の目安（定植14・28日目）です。チェックした項目を計画の候補として追加します（追加後に「保存する」で確定）。</p>
    <div id="import-list" class="wp-import-list"></div>
    <div class="wp-dialog-actions">
      <button id="import-ok" class="primary-btn" type="button">選択した予定を追加</button>
      <button id="import-cancel" class="secondary-btn" type="button">キャンセル</button>
    </div>
  </dialog>

  <script type="module" src="./work-plan.js?v=20261106-help-1"></script>
  <script src="/common/sw-register.js?v=20260713-1"></script>
</body>
</html>
