<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作業予定の追加・編集 - 山本農園</title>
  <link rel="stylesheet" href="/common/css/main.css?v=1">
  <link rel="stylesheet" href="/common/filter.css?v=1">
  <link rel="stylesheet" href="./daily-plan.css?v=20261104-history-1">
</head>
<body>
  <div id="header"></div>
  <main id="page-area" class="page-container" hidden>
    <h1 class="page-title">作業予定の追加・編集</h1>
    <p>作業形態を選び、家族従業員・パート従業員の予定を作成・編集します。家族の時間・圃場は任意、パートの時間はシフトに合わせて設定します。</p>
    <p class="plan-note">保存した予定を業務連絡で読み込んでコピーします。コピー済みの削除は警告付き、送信済みは削除できません。</p>
    <label>日付 <input id="plan-date" type="date" class="form-input"></label>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="reload" type="button" class="secondary-btn">再読み込み</button>
    <button id="plan-login" type="button" class="secondary-btn" hidden>ログイン</button>
    <div class="plan-actions">
      <button id="load-shift" type="button" class="secondary-btn">この日のシフトを読み込む</button>
      <button id="refresh-shift" type="button" class="secondary-btn">TimeTreeから再取得</button>
      <a id="work-plan-link" class="secondary-btn" href="/schedule/work-plan/index.html" target="_blank" rel="noopener">月の作業計画を開く</a>
    </div>
    <p id="shift-state" class="plan-note"></p>
    <section class="card">
      <h2 class="section-title">予定を追加・編集</h2>
      <form id="plan-form">
        <fieldset id="plan-inputs" disabled>
          <legend id="editing-label">新しい予定</legend>
          <label>予定入力の対象<select id="plan-scope" class="form-input">
            <option value="family">家族従業員の予定</option>
            <option value="parts">パート従業員の予定</option>
          </select></label>
          <label>作業形態<select id="plan-kind" class="form-input">
            <option value="">作業形態を選択</option>
            <option value="family">①家族のみ</option>
            <option value="mixed">②家族＋パート</option>
            <option value="parts">③パート複数</option>
            <option value="single">④パート１人</option>
          </select></label>
          <button id="select-workers" type="button" class="secondary-btn">作業者を選択</button>
          <fieldset><legend>作業者</legend><div id="plan-workers" class="info-block">未選択</div></fieldset>
          <p id="participant-kind" class="plan-note" role="status">作業者を選択してください。</p>
          <label id="reporter-group" hidden>連絡係（パートのみ・複数人の場合）<select id="plan-reporter" class="form-input"></select></label>
          <div id="plan-blocks"></div>
          <button id="add-block" type="button" class="secondary-btn">＋作業・時間帯を追加</button>
          <input id="plan-off" type="checkbox" hidden>
          <div class="plan-actions"><button id="plan-off-toggle" type="button" class="secondary-btn plan-toggle" aria-pressed="false">この予定を中止にする（削除せず残します）</button></div>
          <label>中止理由 <input id="plan-off-reason" class="form-input" maxlength="500"></label>
          <label>メモ <textarea id="plan-memo" class="form-textarea" maxlength="2000"></textarea></label>
          <div class="plan-actions">
            <button type="submit" class="primary-btn">予定を保存</button>
            <button id="cancel-edit" type="button" class="secondary-btn">入力をクリア</button>
          </div>
        </fieldset>
      </form>
    </section>
    <section class="card">
      <h2 class="section-title">連絡時点の控え</h2>
      <p class="plan-note">宛先ごとの最新の控えと現在の予定を比較します。コピー済みはLINE送信完了を意味しません。</p>
      <div id="communication-history"></div>
    </section>
    <section class="card">
      <h2 class="section-title">この日の保存済み予定</h2>
      <p id="unplanned-parts" class="plan-note" role="status"></p>
      <div id="saved-plans"></div>
      <button id="continue-team" type="button" class="primary-btn" disabled>続けて作業予定を追加</button>
    </section>
    <div class="plan-actions">
      <a id="message-link" class="secondary-btn" href="/admin/message/index.html">業務連絡ページへ</a>
      <a class="secondary-btn" href="/index.html">トップへ戻る</a>
    </div>
  </main>
  <script type="module" src="./daily-plan.js?v=20261104-history-1"></script>
</body>
</html>
